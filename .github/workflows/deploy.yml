name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches: [production]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -t ed25519 ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Setup Git on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '\
            mkdir -p ~/coding-family/__app__ && \
            cd ~/coding-family/__app__ && \
            git init && \
            git remote add origin ${{ github.repositoryUrl }} || true'

      - name: Test SSH Connection
        run: ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -T ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} exit

      - name: Deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} '\
            cd ~/coding-family/__app__ && \
            git fetch origin production && \
            git reset --hard origin/production && \
            pm2 restart all'
